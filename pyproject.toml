[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msaccess-vcs-mcp"
dynamic = ["version"]
description = "MCP server for Microsoft Access database version control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Adam Waller"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp[cli]>=1.28,<2",
    "python-dotenv>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/joyfullservice/msaccess-vcs-mcp"
Repository = "https://github.com/joyfullservice/msaccess-vcs-mcp"
Issues = "https://github.com/joyfullservice/msaccess-vcs-mcp/issues"

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "twine>=5.0.0",
]

[project.scripts]
msaccess-vcs-mcp = "msaccess_vcs_mcp.main:main"
msaccess-vcs = "msaccess_vcs_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "msaccess_vcs_mcp.__version__"}

[tool.setuptools.package-data]
msaccess_vcs_mcp = [".env.example", "workflow_requirement.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "integration: marks tests as integration tests (require Access installed)",
    "version_gate: exercises X16 admission without the existing unit installation fake",
]
